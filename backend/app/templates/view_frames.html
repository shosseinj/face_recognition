<!DOCTYPE html>
<html>
<head>
    <title>Video Frames Viewer</title>
    <style>
        .frame { margin: 10px; display: inline-block; }
        img { max-width: 300px; border: 1px solid #ccc; }
    </style>
</head>
<body>
    <div id="frames"></div>
    <script>
        fetch('http://localhost:9000/api/v1/extract-frames/8/')
            .then(r => r.json())
            .then(data => {
                const container = document.getElementById('frames');
                data.frames.forEach(frame => {
                    const div = document.createElement('div');
                    div.className = 'frame';
                    div.innerHTML = `
                        <div>Frame ${frame.frame_number} (Index ${frame.frame_index})</div>
                        <img src="data:image/jpeg;base64,${frame.image_base64}">
                        <div>Size: ${frame.image_size_kb.toFixed(2)} KB</div>
                    `;
                    container.appendChild(div);
                });
            });
    </script>
</body>
</html>
