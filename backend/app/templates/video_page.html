<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Face Recognition</title>

    <style>
      body {
        margin: 0;
        padding: 20px;
        font-family: Arial, sans-serif;
      }

      #layout {
        display: flex;
        gap: 20px;
        flex-wrap: wrap;
      }

      #video-section {
        width: 640px;
      }

      #v {
        width: 640px;
        height: 480px;
        border: 2px solid #ccc;
        border-radius: 5px;
        background: black;
      }

      #metadata {
        margin-top: 10px;
        padding: 10px;
        background: #f8f9fa;
        border-radius: 5px;
      }

      #logs-container {
        max-height: 520px;
        overflow-y: auto;
        border: 1px solid #ccc;
        padding: 10px;
        flex: 1;
      }

      .log-entry {
        padding: 10px;
        margin-bottom: 10px;
        border: 1px solid #ddd;
        border-radius: 5px;
        display: flex;
        align-items: center;
        background: white;
        cursor: pointer;
        transition: background-color 0.3s;
      }

      .log-entry:hover {
        background-color: #f0f0f0;
      }

      .new-detection {
        animation: highlight 1.5s;
        background-color: #e6f7ff !important;
      }

      @keyframes highlight {
        from {
          background-color: #e6f7ff;
        }
        to {
          background-color: white;
        }
      }

      .face-image {
        width: 60px;
        height: 60px;
        border-radius: 5px;
        margin-right: 15px;
        object-fit: cover;
        border: 1px solid #ddd;
        cursor: pointer;
      }

      .no-image {
        width: 60px;
        height: 60px;
        margin-right: 15px;
        background: #eee;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 12px;
        border-radius: 5px;
      }

      .person-name {
        font-weight: bold;
        color: #333;
      }

      .confidence {
        font-size: 13px;
        color: #666;
      }

      .timestamp {
        font-size: 12px;
        color: #888;
        margin-top: 5px;
      }

      .video-indicator {
        display: inline-block;
        width: 20px;
        height: 20px;
        margin-left: 10px;
        background: #4caf50;
        color: white;
        border-radius: 3px;
        font-size: 12px;
        text-align: center;
        line-height: 20px;
        cursor: pointer;
      }

      /* modal for images */
      .modal {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.8);
        align-items: center;
        justify-content: center;
        z-index: 1000;
      }

      .modal img {
        max-width: 80%;
        max-height: 80%;
        border: 3px solid white;
        border-radius: 5px;
      }

      .close-modal {
        position: absolute;
        top: 20px;
        right: 30px;
        color: white;
        font-size: 30px;
        cursor: pointer;
      }

      /* video modal */
      .video-modal {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.9);
        align-items: center;
        justify-content: center;
        z-index: 1001;
      }

      .video-modal video {
        max-width: 90%;
        max-height: 90%;
        border: 3px solid white;
        border-radius: 5px;
      }

      .video-info {
        position: absolute;
        top: 80px;
        color: white;
        font-size: 18px;
        background: rgba(0, 0, 0, 0.5);
        padding: 10px;
        border-radius: 5px;
      }

      .close-video-modal {
        position: absolute;
        top: 20px;
        right: 30px;
        color: white;
        font-size: 30px;
        cursor: pointer;
      }
    </style>
  </head>

  <body>
    <h2>Face Recognition Live Stream</h2>

    <div id="layout">
      <div id="video-section">
        <h3>Live Video</h3>
        <img id="v" />
        <div id="metadata">Connecting...</div>
      </div>

      <div style="flex: 1">
        <h3>Recent Detections (50) <span style="font-size: 12px">(Click on any entry to view video)</span></h3>
        <div id="logs-container"></div>
      </div>
    </div>

    <!-- Image Modal -->
    <div id="imageModal" class="modal">
      <span class="close-modal" onclick="closeImageModal()">&times;</span>
      <img id="modalImage" />
    </div>

    <!-- Video Modal -->
    <div id="videoModal" class="video-modal">
      <span class="close-video-modal" onclick="closeVideoModal()">&times;</span>
      <div class="video-info" id="videoInfo"></div>
      <video id="modalVideo" controls preload="auto">
        <source id="videoSource" src="" type="video/mp4" />
        Your browser does not support the video tag.
      </video>
    </div>

    <script>
      console.log(" location.host", location.host);
      const ws = new WebSocket("ws://127.0.0.1:9000/ws/1");
      ws.binaryType = "blob";

      const logsContainer = document.getElementById("logs-container");
      const metadataDiv = document.getElementById("metadata");
      const imageModal = document.getElementById("imageModal");
      const modalImage = document.getElementById("modalImage");
      const videoModal = document.getElementById("videoModal");
      const modalVideo = document.getElementById("modalVideo");
      const videoInfo = document.getElementById("videoInfo");

      let currentDetections = [];

      function formatLogEntry(log) {
        let imageHtml = "";
        debugger;
        if (log.face_image_base64) {
          imageHtml = `<img class="face-image"
                        src="data:image/jpeg;base64,${log.face_image_base64}"
                        onclick="showImage(this.src); event.stopPropagation()">`;
        } else {
          imageHtml = `<div class="no-image">No Image</div>`;
        }

        // Use full_name if available, otherwise fall back to person (national code)
        const displayName = log.full_name || log.person;

        // Add video indicator if video URL exists
        let videoIndicator = "";
        if (log.video_url) {
          videoIndicator = `<span class="video-indicator" onclick="playVideo('${log.video_url}', '${displayName}', '${log.detection_time}'); event.stopPropagation()">▶</span>`;
        }

        const d = new Date(log.detection_time);
        const time = d.toLocaleTimeString();
        const date = d.toLocaleDateString();

        return `
        <div class="log-entry" id="log-${log.id}" onclick="playVideo('${log.video_url}', '${displayName}', '${log.detection_time}')">
            ${imageHtml}
            <div style="flex:1;">
                <div style="display: flex; align-items: center;">
                    <div class="person-name">${displayName}</div>
                    ${videoIndicator}
                </div>
                <div class="confidence">
                    Confidence: ${(log.confidence * 100).toFixed(1)}%
                </div>
                <div class="timestamp">${date} ${time}</div>
            </div>
        </div>
    `;
      }

      function showImage(src) {
        modalImage.src = src;
        imageModal.style.display = "flex";
      }

      function closeImageModal() {
        imageModal.style.display = "none";
      }
      function playVideo(videoUrl, personName, detectionTime) {
        console.log("Attempting to play video:", videoUrl);

        if (!videoUrl) {
          alert("No video available for this detection");
          return;
        }

        // Format the date for display
        const d = new Date(detectionTime);
        const formattedTime = d.toLocaleString();

        videoInfo.innerHTML = `${personName} - ${formattedTime}`;

        // Set the video source
        const videoSource = document.getElementById("videoSource");
        videoSource.src = videoUrl;

        // Load and play
        modalVideo.load();
        videoModal.style.display = "flex";

        modalVideo.play().catch((e) => {
          console.error("Error playing video:", e);
          alert("Could not play video. The video file might not be accessible.");
        });
      }

      function closeVideoModal() {
        modalVideo.pause();
        modalVideo.currentTime = 0;
        videoModal.style.display = "none";
        const videoSource = document.getElementById("videoSource");
        videoSource.src = ""; // Clear source
        modalVideo.load(); // Reload to clear
      }

      ws.onopen = () => (metadataDiv.innerHTML = "✅ Connected");
      ws.onclose = () => (metadataDiv.innerHTML = "❌ Disconnected");
      ws.onerror = () => (metadataDiv.innerHTML = "❌ Error");

      ws.onmessage = (e) => {
        // =============================
        // VIDEO FRAME
        // =============================
        if (e.data instanceof Blob) {
          document.getElementById("v").src = URL.createObjectURL(e.data);
          return;
        }

        // =============================
        // JSON DATA
        // =============================
        const data = JSON.parse(e.data);

        if (data.type === "new_detection") {
          // Store current detections
          currentDetections = data.detection;

          // Update the logs display
          logsContainer.innerHTML = data.detection.map((log) => formatLogEntry(log)).join("");
        } else if (data.type === "video_metadata") {
          if (data.persons?.length) {
            metadataDiv.innerHTML = "<b>Detected:</b> " + data.persons.join(", ");
          } else {
            metadataDiv.innerHTML = "No faces";
          }
        } else if (data.type === "error") {
          metadataDiv.innerHTML = "Error: " + data.message;
        }
      };

      // Close modals when clicking outside
      imageModal.onclick = (e) => {
        if (e.target === imageModal) closeImageModal();
      };

      videoModal.onclick = (e) => {
        if (e.target === videoModal) closeVideoModal();
      };

      // Keyboard shortcuts
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") {
          closeImageModal();
          closeVideoModal();
        }
      });

      // Prevent video modal from closing when clicking on video
      modalVideo.onclick = (e) => {
        e.stopPropagation();
      };
    </script>
  </body>
</html>
