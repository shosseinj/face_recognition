<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Face Recognition</title>
    <style>
      body {
        margin: 0;
        padding: 20px;
        font-family: Arial, sans-serif;
      }

      #layout {
        display: flex;
        gap: 20px;
        flex-wrap: wrap;
      }

      #video-section {
        width: 640px;
      }

      #v {
        width: 640px;
        height: 480px;
        border: 2px solid #ccc;
        border-radius: 5px;
        background: black;
        object-fit: contain;
      }

      #metadata {
        margin-top: 10px;
        padding: 10px;
        background: #f8f9fa;
        border-radius: 5px;
      }

      #logs-container {
        max-height: 520px;
        overflow-y: auto;
        border: 1px solid #ccc;
        padding: 10px;
        flex: 1;
      }

      .log-entry {
        padding: 10px;
        margin-bottom: 10px;
        border: 1px solid #ddd;
        border-radius: 5px;
        display: flex;
        align-items: center;
        background: white;
        cursor: pointer;
        transition: background-color 0.3s;
      }

      .log-entry:hover {
        background-color: #f0f0f0;
      }

      .new-detection {
        animation: highlight 1.5s;
        background-color: #e6f7ff !important;
      }

      @keyframes highlight {
        from {
          background-color: #e6f7ff;
        }
        to {
          background-color: white;
        }
      }

      .face-image {
        width: 60px;
        height: 60px;
        border-radius: 5px;
        margin-right: 15px;
        object-fit: cover;
        border: 1px solid #ddd;
        cursor: pointer;
      }

      .no-image {
        width: 60px;
        height: 60px;
        margin-right: 15px;
        background: #eee;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 12px;
        border-radius: 5px;
      }

      .person-name {
        font-weight: bold;
        color: #333;
      }

      .confidence {
        font-size: 13px;
        color: #666;
      }

      .timestamp {
        font-size: 12px;
        color: #888;
        margin-top: 5px;
      }

      .video-indicator {
        display: inline-block;
        width: 20px;
        height: 20px;
        margin-left: 10px;
        background: #4caf50;
        color: white;
        border-radius: 3px;
        font-size: 12px;
        text-align: center;
        line-height: 20px;
        cursor: pointer;
      }

      .status-badge {
        display: inline-block;
        width: 10px;
        height: 10px;
        border-radius: 50%;
        margin-right: 8px;
      }
      
      .status-connected {
        background-color: #4caf50;
      }
      
      .status-disconnected {
        background-color: #f44336;
      }
      
      .status-connecting {
        background-color: #ff9800;
      }

      /* modal for images */
      .modal {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.8);
        align-items: center;
        justify-content: center;
        z-index: 1000;
      }

      .modal img {
        max-width: 80%;
        max-height: 80%;
        border: 3px solid white;
        border-radius: 5px;
      }

      .close-modal {
        position: absolute;
        top: 20px;
        right: 30px;
        color: white;
        font-size: 30px;
        cursor: pointer;
      }

      /* video modal */
      .video-modal {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.9);
        align-items: center;
        justify-content: center;
        z-index: 1001;
      }

      .video-modal video {
        max-width: 90%;
        max-height: 90%;
        border: 3px solid white;
        border-radius: 5px;
      }

      .video-info {
        position: absolute;
        top: 80px;
        color: white;
        font-size: 18px;
        background: rgba(0, 0, 0, 0.5);
        padding: 10px;
        border-radius: 5px;
      }

      .close-video-modal {
        position: absolute;
        top: 20px;
        right: 30px;
        color: white;
        font-size: 30px;
        cursor: pointer;
      }
      
      .controls {
        margin-bottom: 20px;
        padding: 10px;
        background: #f0f0f0;
        border-radius: 5px;
      }
      
      button {
        padding: 8px 16px;
        margin-right: 10px;
        cursor: pointer;
        background: #4caf50;
        color: white;
        border: none;
        border-radius: 4px;
      }
      
      button:hover {
        background: #45a049;
      }
      
      button.disconnect {
        background: #f44336;
      }
      
      button.disconnect:hover {
        background: #da190b;
      }
    </style>
  </head>

  <body>
    <h2>Face Recognition Live Stream</h2>

    <div id="layout">
      <div id="video-section">
        <h3>Live Video</h3>
        <img id="v" />
        <div id="metadata">
          <span class="status-badge status-disconnected" id="statusBadge"></span>
          <span id="statusText">Disconnected</span>
        </div>
      </div>

      <div style="flex: 1">
        <h3>
          Recent Detections (50)
          <span style="font-size: 12px"
            >(Click on any entry to view video)</span
          >
        </h3>
        <div id="logs-container"></div>
      </div>
    </div>

    <!-- Image Modal -->
    <div id="imageModal" class="modal">
      <span class="close-modal" onclick="closeImageModal()">&times;</span>
      <img id="modalImage" />
    </div>

    <!-- Video Modal -->
    <div id="videoModal" class="video-modal">
      <span class="close-video-modal" onclick="closeVideoModal()">&times;</span>
      <div class="video-info" id="videoInfo"></div>
      <video id="modalVideo" controls preload="auto">
        <source id="videoSource" src="" type="video/mp4" />
        Your browser does not support the video tag.
      </video>
    </div>

    <script>
  // Use the current host instead of hardcoded 127.0.0.1
  const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
  const host = window.location.host;
  const wsUrl = `${protocol}//${host}/ws/0`;
  
  console.log("Connecting to WebSocket:", wsUrl);
  console.log("Current location:", window.location.href);
  
  let ws = null;
  let reconnectAttempts = 0;
  const maxReconnectAttempts = 5;
  
  function connectWebSocket() {
    if (ws && ws.readyState === WebSocket.OPEN) {
      console.log("WebSocket already connected");
      return;
    }
    
    updateStatus('connecting', 'Connecting...');
    
    ws = new WebSocket(wsUrl);
    ws.binaryType = "blob";
    
    ws.onopen = () => {
      console.log("✅ WebSocket connected");
      updateStatus('connected', 'Connected');
      reconnectAttempts = 0;
    };
    
    ws.onclose = () => {
      console.log("❌ WebSocket disconnected");
      updateStatus('disconnected', 'Disconnected');
      
      // Attempt to reconnect
      if (reconnectAttempts < maxReconnectAttempts) {
        reconnectAttempts++;
        console.log(`Reconnecting in 3 seconds... (attempt ${reconnectAttempts}/${maxReconnectAttempts})`);
        setTimeout(connectWebSocket, 3000);
      } else {
        console.log("Max reconnection attempts reached");
        updateStatus('disconnected', 'Disconnected (failed to reconnect)');
      }
    };
    
    ws.onerror = (error) => {
      console.error("WebSocket error:", error);
      updateStatus('disconnected', 'Error');
    };
    
    ws.onmessage = (e) => {
      // VIDEO FRAME
      if (e.data instanceof Blob) {
        const imgElement = document.getElementById("v");
        const url = URL.createObjectURL(e.data);
        imgElement.onload = () => URL.revokeObjectURL(url);
        imgElement.src = url;
        return;
      }
      
      // JSON DATA
      try {
        const data = JSON.parse(e.data);
        console.log("Received data type:", data.type);
        
        if (data.type === "initial_detections") {
          // First time - populate the detection list
          console.log(`📋 Received initial ${data.detections.length} detections`);
          currentDetections = data.detections;
          updateLogsDisplay(data.detections);
          
          // No animation for initial load
        } 
        else if (data.type === "detections_update") {
          // Update existing detection list
          console.log(`🔄 Received detections update: ${data.detections.length} items`);
          currentDetections = data.detections;
          updateLogsDisplay(data.detections);
          
          // Highlight the newest detection (first item usually)
          if (data.detections.length > 0) {
            const newestId = data.detections[0].id;
            const newestElement = document.getElementById(`log-${newestId}`);
            if (newestElement) {
              newestElement.classList.add('new-detection');
              setTimeout(() => {
                newestElement.classList.remove('new-detection');
              }, 1500);
            }
          }
        } 
        else if (data.type === "video_metadata") {
          // Update video overlay with current frame detections
          if (data.persons && data.persons.length) {
            const personsList = data.persons.map((p, idx) => {
              const score = data.scores && data.scores[idx] ? (data.scores[idx] * 100).toFixed(1) : '';
              return `${p}${score ? ` (${score}%)` : ''}`;
            }).join(", ");
            
            metadataDiv.innerHTML = `
              <span class="status-badge status-connected"></span>
              <span>Connected - Detected: ${personsList}</span>
            `;
          } else {
            metadataDiv.innerHTML = `
              <span class="status-badge status-connected"></span>
              <span>Connected - No faces detected</span>
            `;
          }
        } 
        else if (data.type === "error") {
          console.error("Server error:", data.message);
          metadataDiv.innerHTML = `
            <span class="status-badge status-disconnected"></span>
            <span>Error: ${data.message}</span>
          `;
        }
      } catch (error) {
        console.error("Error parsing JSON:", error);
      }
    };
  }
  
  function updateStatus(status, text) {
    const statusBadge = document.getElementById("statusBadge");
    const statusText = document.getElementById("statusText");
    
    statusBadge.className = `status-badge status-${status}`;
    statusText.textContent = text;
    
    metadataDiv.innerHTML = `
      <span class="status-badge status-${status}"></span>
      <span>${text}</span>
    `;
  }
  
  function updateLogsDisplay(detections) {
    // Display all detections (up to whatever limit server sends)
    logsContainer.innerHTML = detections
      .map((log) => formatLogEntry(log))
      .join("");
  }
  
  function disconnectWebSocket() {
    if (ws) {
      ws.close();
      ws = null;
    }
    updateStatus('disconnected', 'Disconnected');
  }
  
  function reconnectWebSocket() {
    disconnectWebSocket();
    setTimeout(connectWebSocket, 1000);
  }
  
  const logsContainer = document.getElementById("logs-container");
  const metadataDiv = document.getElementById("metadata");
  const imageModal = document.getElementById("imageModal");
  const modalImage = document.getElementById("modalImage");
  const videoModal = document.getElementById("videoModal");
  const modalVideo = document.getElementById("modalVideo");
  const videoInfo = document.getElementById("videoInfo");

  let currentDetections = [];

  function formatLogEntry(log) {
    let imageHtml = "";
    if (log.face_image_base64) {
      imageHtml = `<img class="face-image"
                    src="data:image/jpeg;base64,${log.face_image_base64}"
                    onclick="showImage(this.src); event.stopPropagation()">`;
    } else {
      imageHtml = `<div class="no-image">No Image</div>`;
    }

    // Use full_name if available, otherwise fall back to person (national code)
    const displayName = log.full_name || log.person || 'Unknown';
    
    // Add area if available
    const areaInfo = log.area && log.area !== 'بدون ناحیه' ? `<span style="font-size: 11px; color: #666; margin-left: 8px;">📍 ${log.area}</span>` : '';

    // Add video indicator if video URL exists
    let videoIndicator = "";
    if (log.video_url) {
      videoIndicator = `<span class="video-indicator" onclick="playVideo('${log.video_url}', '${displayName}', '${log.detection_time}'); event.stopPropagation()">▶</span>`;
    }

    const d = new Date(log.detection_time);
    const time = d.toLocaleTimeString();
    const date = d.toLocaleDateString();

    return `
    <div class="log-entry" id="log-${log.id}" onclick="playVideo('${log.video_url}', '${displayName}', '${log.detection_time}')">
        ${imageHtml}
        <div style="flex:1;">
            <div style="display: flex; align-items: center; justify-content: space-between;">
                <div style="display: flex; align-items: center;">
                    <div class="person-name">${escapeHtml(displayName)}</div>
                    ${areaInfo}
                </div>
                ${videoIndicator}
            </div>
            <div class="confidence">
                Confidence: ${(log.confidence * 100).toFixed(1)}%
            </div>
            <div class="timestamp">${date} ${time}</div>
        </div>
    </div>
    `;
  }
  
  function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
  }

  function showImage(src) {
    modalImage.src = src;
    imageModal.style.display = "flex";
  }

  function closeImageModal() {
    imageModal.style.display = "none";
  }
  
  function playVideo(videoUrl, personName, detectionTime) {
    console.log("Attempting to play video:", videoUrl);

    if (!videoUrl) {
      alert("No video available for this detection");
      return;
    }

    // Format the date for display
    const d = new Date(detectionTime);
    const formattedTime = d.toLocaleString();

    videoInfo.innerHTML = `${escapeHtml(personName)} - ${formattedTime}`;

    // Set the video source
    const videoSource = document.getElementById("videoSource");
    videoSource.src = videoUrl;

    // Load and play
    modalVideo.load();
    videoModal.style.display = "flex";

    modalVideo.play().catch((e) => {
      console.error("Error playing video:", e);
      alert(
        "Could not play video. The video file might not be accessible.",
      );
    });
  }

  function closeVideoModal() {
    modalVideo.pause();
    modalVideo.currentTime = 0;
    videoModal.style.display = "none";
    const videoSource = document.getElementById("videoSource");
    videoSource.src = ""; // Clear source
    modalVideo.load(); // Reload to clear
  }

  // Close modals when clicking outside
  imageModal.onclick = (e) => {
    if (e.target === imageModal) closeImageModal();
  };

  videoModal.onclick = (e) => {
    if (e.target === videoModal) closeVideoModal();
  };

  // Keyboard shortcuts
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") {
      closeImageModal();
      closeVideoModal();
    }
  });

  // Prevent video modal from closing when clicking on video
  modalVideo.onclick = (e) => {
    e.stopPropagation();
  };
  
  // Auto-connect when page loads
  connectWebSocket();
</script>
